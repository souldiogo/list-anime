<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list anime</title>
    <link rel="stylesheet" href="on-hold.css">
</head>
<body>
    <div class="top-content">
        <div class="left-panel">
            <section class="filters">
                <a href="index.html" class="filter-option">Tudo (13)</a>
                <a href="completed.html" class="filter-option">Completo (23)</a>
                <a href="on-hold.html" class="filter-option active">Em Espera (35)</a>
                <a href="planned.html" class="filter-option">Planejar Assistir (12)</a>
            </section>

            <div class="anime-carousel">
                <div class="anime-list">
                    <div class="anime-card">
                        <img src="anime_png/SCP-gallionic.png" alt="SCP: Gallionic" class="anime-image">
                        <p class="anime-title">SCP: GAllionic</p>
                    </div>
                </div>
            </div>
        </div>
        <aside class="stats-card">
            <section class="stats-section">
                <h2>MY STATS</h2>
                <ul class="stats-list">
                    <li><span>Total Time:</span> <strong>48d14h</strong></li>
                    <li><span>Total Anime:</span> <strong>315</strong></li>
                    <li><span>Mean Score:</span> <strong>8.5</strong></li>
                    <li><span>Days Watching:</span> <strong>11.2</strong></li>
                    <li><span>Completed:</span> <strong>218</strong></li>
                </ul>
            </section>

            <section class="stats-section">
                <h2>RECENT UPDATE</h2>
                <div class="update-item">
                    <span class="status">Continued:</span>
                    <p class="title">Solo leveling Ep.14</p>
                    <span class="time">(1d ago)</span>
                </div>
                <div class="update-item">
                    <span class="status">Completed:</span>
                    <p class="title">Demon Slayer S3</p>
                    <span class="time">(3d ago)</span>
                </div>
            </section>
        </aside>
    </div>
    <script src="on-anime.js"></script>

</body>
</html>
